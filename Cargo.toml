[workspace]
members = [".", "cli"]
default-members = ["cli"]
resolver = "3"

[workspace.package]
version = "0.8.1"
authors = [
    "Fina Wilke <code@felinira.net>",
    "piegames <info@piegames.de>",
    "Brian Warner <warner@lothar.com>",
]
description = "Get things from one computer to another, safely"
keywords = ["magic-wormhole", "wormhole", "file-transfer", "transfer"]
homepage = "http://magic-wormhole.io/"
repository = "https://github.com/magic-wormhole/magic-wormhole.rs/tree/main/cli"
license = "EUPL-1.2"

rust-version = "1.92"
edition = "2024"

[workspace.dependencies]
async-process = "2.5.0"
arboard = "3.6"
async-channel = "2.5"
async-trait = "0.1"
base64 = "0.23.1"
bytecodec = "0.5"
clap = "4"
clap_complete = "4"
color-eyre = "0.6.5"
console = "0.16"
crypto_secretbox = "0.1.1"
ctrlc = "3.5.2"
derive_more = { version = "2", default-features = false }
dialoguer = "0.12"
env_logger = "0.11"
eyre = "0.6.14"
futures = "0.3.34"
futures-lite = "2.6"
futures-concurrency = "7.7.1"
hex = "0.4.3"
hkdf = "0.13.0"
indicatif = "0.18"
macro_rules_attr = "0.2"
noise-protocol = "0.2"
noise-rust-crypto = "0.6.2"
unit-prefix = "0.5"
percent-encoding = "2.3.2"
qr2term = "0.3.3"

# crypto_secretbox 0.1 and spake2 0.4 use rand_core 0.6.
rand = "0.8.8"
rmp-serde = "1.3.1"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
smol = "2.0"
async-executor = "1.14"
async-fs = "2.2"
async-io = "2.6.0"
async-net = "2.0"
async-task = "4.7"
spake2 = "0.4.0"
stun_codec = "0.4.0"
tar = "0.4.46"
thiserror = "2"
time = "0.3.55"
trycmd = "1.2"
url = "2.5.8"
tracing = "0.1"
tracing-subscriber = "0.3"
test-log = "0.2"
zxcvbn = "3.1.1"
wasmtimer = "0.4"

[package]
name = "magic-wormhole"
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/magic-wormhole/latest/"
readme = "README.md"

version.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

rust-version.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
features = ["all"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
serde_derive = { workspace = true }
crypto_secretbox = { workspace = true }
spake2 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true, features = ["serde"] }
rand = { workspace = true }
base64 = { workspace = true }
time = { workspace = true, features = ["formatting"] }
futures-lite = { workspace = true }
futures-concurrency = { workspace = true }

derive_more = { workspace = true, features = ["display", "deref", "from"] }
thiserror = { workspace = true }

futures = { workspace = true }
url = { workspace = true, features = ["serde"] }
percent-encoding = { workspace = true }
zxcvbn = { workspace = true }

tracing = { workspace = true, features = ["log"] }

fuzzt = { version = "0.3.1", optional = true }

# Transit dependencies


stun_codec = { workspace = true, optional = true }
bytecodec = { workspace = true, optional = true }
noise-rust-crypto = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
noise-protocol = { workspace = true, optional = true }
async-task = { workspace = true }
# Transfer dependencies

rmp-serde = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

# Forwarding dependencies

# rmp-serde = … # defined above

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc = "0.2.189"
async-executor = { workspace = true }
async-process = { workspace = true, optional = true }
async-tungstenite = { version = "0.35", features = ["smol-runtime"] }
async-io = { workspace = true }
async-net = { workspace = true }
async-fs = { workspace = true }

# Transit

socket2 = { version = "0.6", optional = true, features = ["all"] }
if-addrs = { version = "0.15", optional = true }

# Transfer

[target.'cfg(target_family = "wasm")'.dependencies]
ws_stream_wasm = "0.7.5"
# Enable browser entropy for the rand_core 0.6 crypto dependencies.
getrandom = { version = "0.2.17", features = ["js"] }
wasmtimer = { workspace = true }

# for some tests
[dev-dependencies]
test-log = { workspace = true, features = ["trace"] }
eyre = { workspace = true }
async-process = { workspace = true }
macro_rules_attr = { workspace = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
transfer = ["transit", "dep:tar", "dep:rmp-serde"]
transit = [
    "dep:noise-rust-crypto",
    "dep:noise-protocol",
    "dep:socket2",
    "dep:stun_codec",
    "dep:if-addrs",
    "dep:bytecodec",
    "dep:async-trait",
]
forwarding = ["transit", "dep:rmp-serde", "dep:async-process"]
default = ["transit", "transfer"]
all = ["default", "forwarding", "fuzzy-complete"]

# TLS implementations for websocket connections via async-tungstenite
# required for optional wss connection to the mailbox server
# Keep the original feature name with a maintained TLS backend and bundled roots.
tls = ["futures-rustls-webpki-roots"]
futures-rustls-manual-roots = ["async-tungstenite/futures-rustls-manual-roots"]
futures-rustls-native-certs = ["async-tungstenite/futures-rustls-native-certs"]
futures-rustls-platform-verifier = ["async-tungstenite/futures-rustls-platform-verifier"]
futures-rustls-webpki-roots = ["async-tungstenite/futures-rustls-webpki-roots"]
native-tls = ["async-tungstenite/smol-native-tls"]
# Enable experimental transfer-v2 support. The protocol is not yet finalized and is subject to change.
# By enabling this option you are opting out of semver stability.
experimental-transfer-v2 = []
experimental = ["experimental-transfer-v2"]
fuzzy-complete = ["fuzzt"]

[profile.release]
overflow-checks = true
strip = "debuginfo"
lto = "thin"
