[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "EUPL-1.2",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false
registries = []

# Existing Windows clipboard dependencies, reached through arboard.
# https://spdx.org/licenses/BSL-1.0.html
[[licenses.exceptions]]
name = "clipboard-win"
version = "=5.4.1"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
version = "=3.4.0"
allow = ["BSL-1.0"]

# Existing Wayland clipboard dependency, reached through wl-clipboard-rs.
# https://spdx.org/licenses/Zlib.html
[[licenses.exceptions]]
name = "foldhash"
version = "=0.1.5"
allow = ["Zlib"]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
